name: Build

# Reusable: test on every OS, then build the standalone apps and upload them as artifacts.
on:
  workflow_call:
    inputs:
      version:
        description: Version shown in the app (e.g. v1.2.3)
        type: string
        default: dev
      ref:
        description: Commit to build
        type: string
        default: ""

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile gtworld.py stream-growtopia-world.py test_overlay.py
      - run: python tests/test_gtworld.py
      - if: runner.os != 'Windows'
        run: bash -n start-mac.command

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest        # Apple Silicon (M1 and newer)
            artifact: macos-apple-silicon
          - os: macos-15-intel      # Intel Macs
            artifact: macos-intel
    runs-on: ${{ matrix.os }}
    # Intel Mac runners are being phased out by GitHub; don't block a release on them.
    continue-on-error: ${{ matrix.artifact == 'macos-intel' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python packaging/build.py "${{ inputs.version }}"
        shell: bash

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir out
          cp dist/GrowtopiaWorldOBS.exe "out/GrowtopiaWorldOBS-${{ inputs.version }}-windows.exe"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir out
          # ditto keeps the bundle's permissions, symlinks and signature intact
          ditto -c -k --sequesterRsrc --keepParent "dist/Growtopia World OBS.app" \
            "out/GrowtopiaWorldOBS-${{ inputs.version }}-${{ matrix.artifact }}.zip"

      - name: Smoke test (Windows) - app starts and keeps running
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/GrowtopiaWorldOBS.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "App exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Get-Process GrowtopiaWorldOBS -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Smoke test (macOS) - app starts and keeps running
        if: runner.os == 'macOS'
        run: |
          "dist/Growtopia World OBS.app/Contents/MacOS/Growtopia World OBS" &
          pid=$!
          sleep 10
          kill -0 "$pid" || { echo "App exited early"; exit 1; }
          kill "$pid"

      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error
