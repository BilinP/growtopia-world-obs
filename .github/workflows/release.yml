name: Release

# Publishes a GitHub release:
#  - daily, if anything was pushed to main since the last release (patch version bump)
#  Each release ships the standalone Windows + macOS apps (see build.yml) and the source.
#  - when a v* tag is pushed (that exact version)
#  - on demand from the Actions tab
on:
  schedule:
    - cron: "0 12 * * *"  # every day at 12:00 UTC
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      previous: ${{ steps.plan.outputs.previous }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history and tags

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            sha="$(git rev-list -n 1 "$tag")"
            previous="$(git describe --tags --abbrev=0 --match 'v*' "${sha}^" 2>/dev/null || true)"
          else
            git checkout -q origin/main
            sha="$(git rev-parse HEAD)"
            previous="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
            if [ -z "$previous" ]; then
              tag="v1.0.0"
            elif [ "$(git rev-list --count "${previous}..HEAD")" = "0" ]; then
              echo "No new commits since $previous - nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            else
              IFS=. read -r major minor patch <<< "${previous#v}"
              tag="v${major}.${minor}.$((patch + 1))"
            fi
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists - nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Will release $tag ($sha), previous: ${previous:-none}"
          {
            echo "release=true"
            echo "tag=$tag"
            echo "previous=$previous"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"


  build:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.plan.outputs.tag }}
      ref: ${{ needs.plan.outputs.sha }}

  release:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.sha }}

      - name: Collect the apps
        uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: dist
          merge-multiple: true

      - name: Add the source download
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          # git archive keeps the executable bit on start-mac.command
          git archive --format=zip --prefix="growtopia-world-obs-${TAG}/" \
            -o "dist/growtopia-world-obs-${TAG}-source.zip" HEAD
          ls -la dist

      - name: Write release notes
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
        run: |
          has() { ls dist/*"$1"* >/dev/null 2>&1; }
          {
            echo "## Download"
            echo
            echo "No Python or setup needed: download the app for your computer from **Assets** below."
            echo
            echo "| Computer | Download |"
            echo "|---|---|"
            echo "| Windows 10/11 | \`GrowtopiaWorldOBS-${TAG}-windows.exe\` |"
            has macos-apple-silicon && echo "| Mac with Apple chip (M1 or newer) | \`GrowtopiaWorldOBS-${TAG}-macos-apple-silicon.zip\` |"
            has macos-intel && echo "| Mac with Intel chip | \`GrowtopiaWorldOBS-${TAG}-macos-intel.zip\` |"
            echo
            echo "Not sure which Mac you have? Apple menu → **About This Mac** → look at **Chip** (Apple M…) or **Processor** (Intel)."
            echo
            echo "### First launch"
            echo
            echo "The app isn't signed with a paid developer certificate, so your computer warns you once:"
            echo
            echo "- **Windows:** if you see \"Windows protected your PC\", click **More info** → **Run anyway**."
            echo "- **macOS:** unzip it and drag **Growtopia World OBS** into Applications, then open it. If macOS says it can't be"
            echo "  opened, go to **System Settings → Privacy & Security**, scroll down and click **Open Anyway**."
            echo
            echo "Then follow the [setup steps](https://github.com/${GITHUB_REPOSITORY}#setup) (turn on OBS's WebSocket server, click **Save & Start**)."
            echo
            echo "Developers: \`growtopia-world-obs-${TAG}-source.zip\` has the Python source."
            echo
            echo "## Changes"
            echo
            if [ -n "$PREVIOUS" ]; then
              git log --no-merges --format='- %s (%h)' "${PREVIOUS}..HEAD"
              echo
              echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS}...${TAG}"
            else
              echo "First public release."
            fi
          } > notes.md
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --notes-file notes.md \
            --target "$SHA"
